# JVM：本机 JDK 21（D:/Java/Java21）。若换机器请改成目标机 JDK 17+ 的路径或删除此行改用 JAVA_HOME。
org.gradle.java.home=D:/Java/Java21
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=false
# 本工程位于中文路径（…\Desktop\内网图片管理器\android）。AGP 默认对非 ASCII
# 工程路径报错，但实际编译/打包在 Windows + UTF-8 下工作正常（本仓库旧的
# Capacitor 工程就是从同一路径成功构建的），因此显式关闭该检查。
android.overridePathCheck=true

kotlin.code.style=official
