# ============================================================
# 内网图片管理器 · Docker Compose（Linux 部署）
# 用法（在仓库根目录）：
#   docker compose -f deploy/docker-compose.yml up -d --build
#   docker compose -f deploy/docker-compose.yml logs -f app
#   docker compose -f deploy/docker-compose.yml down
# 说明：
#   - app 容器内固定监听 4311，对外端口由 .env 的 APP_PORT 决定
#   - PostgreSQL 只在内部网络，不占用宿主机 5432（避免与已有服务冲突）
#   - 数据：postgres 用命名卷 fluxframe-postgres；图片/模型/日志用 ./data 挂载
# ============================================================
name: fluxframe

services:
  postgres:
    image: postgres:17-alpine
    container_name: fluxframe-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: image_manager
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 deploy/.env 中设置 POSTGRES_PASSWORD}
      TZ: ${TZ:-Asia/Shanghai}
      PGTZ: ${TZ:-Asia/Shanghai}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d image_manager"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - fluxframe

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: fluxframe:latest
    container_name: fluxframe-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/image_manager?schema=public
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${APP_PORT:-4311}:4311"
    volumes:
      - ./data/storage:/data/storage
      - ./data/models:/data/models
      - ./data/logs:/data/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:4311/api/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s
    networks:
      - fluxframe

volumes:
  postgres-data:
    name: fluxframe-postgres

networks:
  fluxframe:
    name: fluxframe-net
